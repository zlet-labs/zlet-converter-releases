name: Feature request
description: Suggest an improvement to a real document workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow or problem
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
